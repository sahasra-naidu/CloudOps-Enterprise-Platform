name: CloudOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        working-directory: app
        run: |
          python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build -t cloudops-api:${{ github.sha }} ./app

      - name: Verify Docker image
        run: |
          docker images cloudops-api

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CloudOps EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/CloudOps-Enterprise-Platform
            git pull origin main
            sudo systemctl restart k3s
            sleep 30
            sudo k3s kubectl rollout restart deployment/cloudops-api
            sudo k3s kubectl rollout status deployment/cloudops-api --timeout=120s